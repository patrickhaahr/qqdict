<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'self' data:" />
    <link rel="stylesheet" href="/src/popover.css" />
    <title>qqdict · Recent</title>
  </head>
  <body>
    <main class="popover">
      <header class="header">
        <h1>qqdict</h1>
        <div class="state" role="status" aria-live="polite">
          <span id="state-dot" aria-hidden="true"></span>
          <span id="state-label">Connecting</span>
        </div>
        <button id="settings-button" class="icon-button gear" type="button" aria-label="Open settings" title="Settings">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 2-.5 2-1.7 1-2-.6-2 3.4 1.5 1.4v2L2 12.6l2 3.4 2-.6 1.7 1 .5 2h4l.5-2 1.7-1 2 .6 2-3.4-1.5-1.4v-2L18 7.8l-2-3.4-2 .6-1.7-1-.5-2Z"/><circle cx="10" cy="10.2" r="2.6"/></svg>
        </button>
      </header>
      <div id="popover-error" class="error-message" role="alert" hidden></div>
      <section class="recents" aria-labelledby="recent-heading">
        <h2 id="recent-heading">Recent</h2>
        <div id="history" class="history" aria-label="Last ten transcripts">
          <p class="empty-state">No transcripts yet</p>
        </div>
      </section>
      <footer class="actionbar">
        <span class="shortcut" id="shortcut-hint">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.5a3 3 0 0 1 6 0V7a3 3 0 0 1-6 0ZM2.5 6.5v.8a5.5 5.5 0 0 0 11 0v-.8M8 13v2M5.5 15h5"/></svg>
          <span>Hold</span><kbd id="hotkey-label">fn</kbd>
        </span>
        <div class="footer-actions">
          <button id="journal-button" class="icon-button" type="button" aria-label="Open journal" title="Journal">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6V4.5A1.5 1.5 0 0 1 4.5 3H8l2 3h5.5A1.5 1.5 0 0 1 17 7.5v7a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 14.5Z"/></svg>
          </button>
          <button id="quit-button" class="icon-button" type="button" aria-label="Quit qqdict" title="Quit qqdict">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2v7M5.5 4.5a7 7 0 1 0 9 0"/></svg>
          </button>
        </div>
      </footer>
      <div id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    </main>
    <script type="module" src="/src/popover.ts"></script>
  </body>
</html>
